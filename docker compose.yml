services:
  # ----------------------------------------------------
  # TRAEFIK: API Gateway (Dashboard available on :8888)
  # ----------------------------------------------------
  traefik:
    image: traefik:v3
    container_name: traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      # Defines the standard web entrypoint for port 80
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8888:8080"   
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy-net

  # ----------------------------------------------------
  # MINIO: Enterprise Private Cloud Storage
  # ----------------------------------------------------
  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    environment:
      MINIO_ROOT_USER: \${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: \${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_enterprise_data:/data
    ports:
      - "9000:9000"   
      - "9001:9001"   
    command: server /data --console-address ":9001"
    networks:
      - proxy-net
    labels:
      - "traefik.enable=true"

      # Router 1: MinIO S3 API (Handles data transfer)
      - "traefik.http.routers.minio-api.rule=Host(`s3.localhost`)"
      - "traefik.http.routers.minio-api.entrypoints=web"
      - "traefik.http.services.minio-api.loadbalancer.server.port=9000"

      # Router 2: MinIO Web Console (Handles management browser UI)
      - "traefik.http.routers.minio-console.rule=Host(`console.localhost`)"
      - "traefik.http.routers.minio-console.entrypoints=web"
      - "traefik.http.services.minio-console.loadbalancer.server.port=9001"

# ----------------------------------------------------
# NETWORKS & VOLUMES: Managed resources
# ----------------------------------------------------
networks:
  proxy-net:
    name: proxy-net

volumes:
  minio_enterprise_data:
    name: minio_enterprise_data
